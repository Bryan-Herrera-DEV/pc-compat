[package]
name = "pc-compat"
version = "0.4.0"
edition = "2021"
rust-version = "1.92"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
windows = { version = "0.59", features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
